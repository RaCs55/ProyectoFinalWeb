<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Registro - Los Pollos Hermanos</title>
</head>

<body>
    <header>
        <nav>
            <div class="titulo">
                <h1>Los Pollos Hermanos</h1>
            </div>
            <ul class="menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="coleccion.html">Colección</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="formulario">
            <div class="imagen-izquierda">
                <img src="img/Los_Pollos_Hermanos_logo.png" alt="Logo de Los Pollos Hermanos">
            </div>

            <form action="" method="POST" class="registro-form">
                <h2>Formulario de Registro</h2>
                <label for="nombre">Nombre:</label>
                <input type="text" name="nombre" id="nombre" required>

                <label for="apellido">Apellido:</label>
                <input type="text" name="apellido" id="apellido" required>

                <label for="email">Email:</label>
                <input type="email" name="email" id="email" required>

                <label for="password">Contraseña:</label>
                <input type="password" name="password" id="password" required>

                <button type="submit" class="btn_registro">Registrarse</button>
            </form>
        </section>
    </main>


    <footer>
        <div class="links_footer">
            <a href="">Aviso Legal</a>
            <a href="">Politica de Privacidad</a>
            <a href="">Contacto</a>

        </div>


        <div class="links_rrss_footer">
            <a class="logo-link" href="https://www.instagram.com/eatlospolloshermanos/?hl=es" aria-label="Instagram">
                <img src="img/instagram.png" alt="Instagram">
            </a>
            <a class="logo-link" href="https://www.tiktok.com/discover/los-pollos-hermanos?lang=es" aria-label="TikTok">
                <img src="img/tik-tok.png" alt="TikTok">
            </a>
            <a class="logo-link" href="https://www.youtube.com/@breakingbad" aria-label="YouTube">
                <img src="img/youtube.png" alt="YouTube">
            </a>
        </div>
    </footer>
</body>

</html>
